name: Deploy Web Rewards

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Set environment variables for Next.js
        run: |
          echo "NEXT_PUBLIC_API_URL=https://api.example.com" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_STATIC_URL=${{ secrets.NEXT_PUBLIC_STATIC_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_REWARDS_API_URL=${{ secrets.NEXT_PUBLIC_REWARDS_API_URL }}" >> $GITHUB_ENV
          echo "TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}" >> $GITHUB_ENV
          echo "TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}" >> $GITHUB_ENV
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> $GITHUB_ENV

      - name: Build project
        run: pnpm run pages:build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'web-rewards'
          directory: '.vercel/output/static'
          wranglerVersion: '3'
